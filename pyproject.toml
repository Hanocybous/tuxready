[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tuxready"
version = "0.1.0"
description = "Check whether your Windows apps and games will work on Linux before you switch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hanocybous" }]
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]
keywords = ["linux", "windows", "proton", "steam", "migration", "compatibility", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Hanocybous/tuxready"
Issues = "https://github.com/Hanocybous/tuxready/issues"

[project.scripts]
tuxready = "tuxready.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/tuxready"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
