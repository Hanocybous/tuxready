name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest ruff
      - run: ruff check src tests
      - run: pytest -q
      # On Windows this reads the runner's real registry, so the scanner gets exercised for real.
      - name: Smoke test (scan this machine)
        run: python -m tuxready --plain --offline
      - name: Smoke test (names)
        run: python -m tuxready --plain --offline Discord Photoshop "game: Valorant"
