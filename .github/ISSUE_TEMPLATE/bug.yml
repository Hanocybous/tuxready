name: Bug report
description: tuxready crashed or didn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include any error message. Running with `--plain` and pasting the output helps.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Where did you run tuxready?
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tuxready version
      placeholder: tuxready 0.1.0
